[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chunklab"
version = "1.0.0"
description = "Offline local GUI for structural and opt-in guided document chunking experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "ChunkLab Authors" },
]
keywords = ["chunking", "streamlit", "offline", "retrieval", "korean"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "markdown-it-py>=3.0",
  "streamlit>=1.67",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
chunklab = "chunklab.app:cli"

[tool.setuptools.packages.find]
include = ["chunklab*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
